<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Moji oglasi</ion-title>
    <ion-buttons slot="end">
      <ion-fab-button size="small" color="primary" (click)="openAddModal()">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="loadMyListings($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (!isLoading && listings.length === 0) {
  <div class="empty-state">
    <ion-icon name="megaphone-outline"></ion-icon>
    <p>
      Još nisi postavila oglas. Pritisni + da tražiš čuvara za svog ljubimca.
    </p>
  </div>
  } @else {
  <ion-list>
    @for (listing of listings; track listing.id) {
    <ion-item-sliding #slidingItem>
      <app-listing-element
        [listing]="listing"
        [routerLink]="['/', 'listings', 'tabs', 'explore', listing.id]"
      ></app-listing-element>
      <ion-item-options side="end">
        <ion-item-option
          color="warning"
          (click)="openEditModal(listing, slidingItem)"
        >
          <ion-icon slot="icon-only" name="create"></ion-icon>
        </ion-item-option>

        <ion-item-option
          color="danger"
          (click)="onDeleteListing(listing, slidingItem)"
        >
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
    }
  </ion-list>
  }
</ion-content>
