<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="primary">
      <ion-button (click)="onCancel()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-text-center">
  <form (ngSubmit)="onSave()" #f="ngForm">
    <ion-grid>
      <ion-row>
        <ion-col size-sm="3" offset-sm="3">
          <ion-item>
            <ion-input
              type="text"
              label="Ime ljubimca"
              label-placement="floating"
              [ngModel]="petName"
              name="name"
              required
            ></ion-input>
          </ion-item>
        </ion-col>
        <ion-col size-sm="3">
          <ion-item>
            <ion-select
              label="Vrsta"
              label-placement="floating"
              [ngModel]="vrsta"
              name="vrsta"
              required
            >
              @for (v of vrste; track v) {
                <ion-select-option [value]="v">{{ v }}</ion-select-option>
              }
            </ion-select>
          </ion-item>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size-sm="3" offset-sm="3">
          <ion-item>
            <ion-input
              type="text"
              label="Rasa (opciono)"
              label-placement="floating"
              [ngModel]="rasa"
              name="rasa"
            ></ion-input>
          </ion-item>
        </ion-col>
      </ion-row> <ion-row>
        <ion-col size="6">
          <ion-item>
            <ion-input
              label="Godine"
              labelPlacement="floating"
              type="number"
              min="0"
              max="30"
              [ngModel]="godine"
              name="godine">
            </ion-input>
          </ion-item>
        </ion-col>
        <ion-col size="6">
          <ion-item>
            <ion-input
              label="Meseci"
              labelPlacement="floating"
              type="number"
              min="0"
              max="11"
              [ngModel]="meseci"
              name="meseci">
            </ion-input>
          </ion-item>
        </ion-col>
      </ion-row>
      
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item>
            <ion-textarea
              label="Opis (navike, alergije, temperament...)"
              label-placement="floating"
              rows="3"
              [ngModel]="opis"
              name="opis"
            ></ion-textarea>
          </ion-item>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-item lines="none">
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;">
            
            <ion-button type="button" fill="outline" (click)="fileInput.click()" expand="block" style="width: 100%;">
              <ion-icon name="camera-outline" slot="start"></ion-icon>
              Izaberi sliku iz galerije
            </ion-button>
          </ion-item>

          <input type="hidden" [ngModel]="imageUrl" name="imageUrl">

          @if (imageUrl) {
            <div class="ion-text-center ion-padding">
              <img [src]="imageUrl" style="max-width: 100%; max-height: 200px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);" />
            </div>
          }
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-button type="submit" color="primary" expand="block" [disabled]="!f.valid">
            Sačuvaj
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
