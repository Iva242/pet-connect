<ion-header>
  <ion-toolbar>
    <ion-title>Prijava</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #logInForm="ngForm" (ngSubmit)="onLogIn(logInForm)">
    <ion-grid>
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-list>
            <ion-item>
              <ion-input type="email" label="Email" labelPlacement="floating"
                         #email="ngModel" ngModel email required name="email"></ion-input>
            </ion-item>

            @if (email.invalid && email.touched) {
              <ion-item lines="none">
                <ion-label color="danger">Unesite ispravnu email adresu.</ion-label>
              </ion-item>
            }

            <ion-item>
              <ion-input type="password" label="Lozinka" labelPlacement="floating"
                         ngModel minlength="7" required #password="ngModel" name="password">
                <ion-input-password-toggle slot="end"></ion-input-password-toggle>
              </ion-input>
            </ion-item>

            @if (password.invalid && password.touched) {
              <ion-item lines="none">
                <ion-label color="danger">Lozinka mora imati najmanje 7 karaktera.</ion-label>
              </ion-item>
            }
          </ion-list>
        </ion-col>
      </ion-row>

      <ion-row class="ion-justify-content-center">
        <ion-col size-sm="6">
          <ion-button
            type="submit"
            color="primary"
            shape="round"
            expand="block"
            [disabled]="logInForm.invalid"
          >Prijavi se</ion-button>
        </ion-col>
      </ion-row>

      <ion-row class="ion-justify-content-center">
        <ion-col size-sm="6" class="ion-text-center">
          <ion-button fill="clear" routerLink="/register">
            Nemaš nalog? Registruj se
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
